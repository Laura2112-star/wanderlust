<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wanderlust</title>
<meta name="apple-mobile-web-app-title" content="Wanderlust">
<link rel="apple-touch-icon" href="icon-180.png?v=4">
<link rel="icon" type="image/png" href="icon-192.png?v=4">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#e0368f,#16b36a);color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .box{display:grid;gap:14px;justify-items:center;max-width:360px}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  a{color:#fff;font-weight:600}
  p{margin:0;opacity:.95}
</style>
</head>
<body>
<div class="box">
  <img src="icon-180.png?v=4" alt="">
  <p id="msg">Abriendo Wanderlust en Claude…</p>
  <p id="tip" hidden>Para tener este acceso en tu iPhone, pulsa <b>Compartir</b> y luego <b>"Añadir a pantalla de inicio"</b>.<br><br><a href="https://claude.ai/artifact/XgfprBWxYYcFQcWyVBC6sV">Abrir Wanderlust</a></p>
</div>
<script>
  // Opened from the home-screen icon: go straight to the artifact.
  // Opened normally in Safari for the first time: show how to add it, so the redirect does not get in the way.
  var target = "https://claude.ai/artifact/XgfprBWxYYcFQcWyVBC6sV";
  var fromHome = /[?&]go=1/.test(location.search) || (window.navigator.standalone === true);
  var seen = false; try { seen = localStorage.getItem("wl-launch-seen") === "1"; localStorage.setItem("wl-launch-seen","1"); } catch(e){}
  if (fromHome || seen) { location.replace(target); }
  else { document.getElementById("msg").textContent = "Acceso a Wanderlust"; document.getElementById("tip").hidden = false; }
</script>
</body>
</html>
