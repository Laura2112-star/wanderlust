<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Italiano</title>
<meta name="apple-mobile-web-app-title" content="Italiano">
<meta name="theme-color" content="#008c45">
<link rel="manifest" href="it.webmanifest">
<link rel="apple-touch-icon" href="italiano-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="italiano-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="italiano-512.png?v=2">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(90deg,#008c45,#f5f2eb 50%,#cd212a);color:#1c1c1c;text-align:center;padding:24px;box-sizing:border-box}
  .box{display:grid;gap:14px;justify-items:center;max-width:360px}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  a{color:#1c1c1c;font-weight:600}
  p{margin:0;opacity:.95}
</style>
</head>
<body>
<div class="box">
  <img src="italiano-180.png?v=2" alt="">
  <p id="msg">Apriamo Italiano in Viaggio…</p>
  <p id="tip" hidden>Para tener este acceso en tu iPhone, pulsa <b>Compartir</b> y luego <b>"Añadir a pantalla de inicio"</b>.<br><br><a href="https://claude.ai/artifact/Q4PDbvoHYrGPCDGMSXdAqJ">Abrir Italiano in Viaggio</a></p>
</div>
<script>
  // Only the home-screen icon (saved with "?go=1") redirects; opening the plain address never does.
  var target = "https://claude.ai/artifact/Q4PDbvoHYrGPCDGMSXdAqJ";
  var asApp = window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: minimal-ui)").matches || matchMedia("(display-mode: window-controls-overlay)").matches);
  if (asApp || /[?&]go=1/.test(location.search)) { location.replace(target); }
  else {
    try { history.replaceState(null, "", location.pathname + "?go=1"); } catch(e){}
    document.getElementById("msg").textContent = "Acceso a Italiano in Viaggio";
    document.getElementById("tip").hidden = false;
  }
</script>
</body>
</html>
